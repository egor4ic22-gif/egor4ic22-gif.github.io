<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay Demo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:90%;
max-width:420px;
background:#111;
border-radius:30px;
padding:40px;
text-align:center;
box-shadow:0 0 40px rgba(255,255,255,.08);
}

.logo{
font-size:70px;
margin-bottom:10px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

p{
color:#888;
margin-bottom:30px;
}

#apple-pay-button{
-webkit-appearance:-apple-pay-button;
-apple-pay-button-type:buy;
-apple-pay-button-style:black;
width:100%;
height:55px;
border:none;
cursor:pointer;
}

.demoBtn{
width:100%;
height:55px;
border:none;
border-radius:14px;
background:white;
color:black;
font-size:22px;
font-weight:700;
cursor:pointer;
display:none;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.sheet{
background:#1c1c1e;
width:100%;
max-width:340px;
border-radius:28px;
padding:30px;
text-align:center;
animation:show .25s ease;
}

@keyframes show{
from{
transform:scale(.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.success{
font-size:70px;
margin-bottom:15px;
}

.close{
margin-top:20px;
width:100%;
height:50px;
border:none;
border-radius:12px;
background:#0a84ff;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<div class="logo"></div>

<h1>Apple Pay</h1>

<p>Fast. Secure. Private.</p>

<button id="apple-pay-button"></button>

<button class="demoBtn" id="demoBtn">
 Apple Pay Demo
</button>

</div>

<div class="modal" id="modal">
<div class="sheet">

<div class="success">✅</div>

<h2>Payment Successful</h2>

<p style="margin-top:10px">
Demo Simulation
</p>

<button class="close" onclick="closeModal()">
Done
</button>

</div>
</div>

<script>

const appleBtn =
document.getElementById("apple-pay-button");

const demoBtn =
document.getElementById("demoBtn");

if (
window.ApplePaySession &&
ApplePaySession.canMakePayments()
){

appleBtn.addEventListener(
"click",
beginApplePay
);

}else{

appleBtn.style.display="none";
demoBtn.style.display="block";

demoBtn.onclick=()=>{
document.getElementById("modal")
.style.display="flex";
};
}

function beginApplePay(){

try{

const paymentRequest = {
countryCode:"US",
currencyCode:"USD",
supportedNetworks:[
"visa",
"masterCard",
"amex"
],
merchantCapabilities:[
"supports3DS"
],
total:{
label:"Demo Store",
amount:"9.99"
}
};

const session =
new ApplePaySession(
3,
paymentRequest
);

session.onvalidatemerchant = () => {

document.getElementById("modal")
.style.display="flex";

};

session.begin();

}catch{

document.getElementById("modal")
.style.display="flex";

}
}

function closeModal(){

document.getElementById("modal")
.style.display="none";

}

</script>

</body>
</html>
