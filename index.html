```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay Demo</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#111827;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#apple-pay-button{
    -webkit-appearance:-apple-pay-button;
    -apple-pay-button-type:buy;
    -apple-pay-button-style:black;
    width:250px;
    height:50px;
    border:none;
}
</style>
</head>
<body>

<button id="apple-pay-button"></button>

<script>

if (
    window.ApplePaySession &&
    ApplePaySession.canMakePayments()
) {

    document
        .getElementById("apple-pay-button")
        .addEventListener("click", beginApplePay);

} else {

    alert("Apple Pay is not available");

}

function beginApplePay() {

    const paymentRequest = {
        countryCode: "US",
        currencyCode: "USD",
        supportedNetworks: [
            "visa",
            "masterCard",
            "amex"
        ],
        merchantCapabilities: [
            "supports3DS"
        ],
        total: {
            label: "Demo Store",
            amount: "9.99"
        }
    };

    const session =
        new ApplePaySession(3, paymentRequest);

    session.onvalidatemerchant = function () {

        // DEMO ONLY
        session.completeMerchantValidation({});
    };

    session.onpaymentauthorized = function () {

        session.completePayment({
            status: ApplePaySession.STATUS_SUCCESS
        });

        alert("Payment successful!");
    };

    session.begin();
}

</script>

</body>
</html>
