<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Apple Pay Demo</title>
</head>
<body>

<button id="apple-pay-button">Apple Pay</button>

<script>
document
  .getElementById("apple-pay-button")
  .addEventListener("click", onApplePayButtonClicked);

async function onApplePayButtonClicked() {

    if (!window.ApplePaySession) {
        alert("Apple Pay не поддерживается");
        return;
    }

    if (!ApplePaySession.canMakePayments()) {
        alert("Apple Pay недоступен");
        return;
    }

    const request = {
        countryCode: "US",
        currencyCode: "USD",
        merchantCapabilities: ["supports3DS"],
        supportedNetworks: [
            "visa",
            "masterCard",
            "amex"
        ],
        total: {
            label: "Demo Store",
            amount: "1.99",
            type: "final"
        }
    };

    const session = new ApplePaySession(3, request);

    session.onvalidatemerchant = async function(event) {
        console.log("Merchant validation URL:", event.validationURL);

        // Заглушка для демо
        session.abort();

        alert(
            "Для настоящего Apple Pay нужен Merchant ID и серверная валидация."
        );
    };

    session.onpaymentauthorized = function(event) {

        console.log("Payment authorized", event.payment);

        session.completePayment(
            ApplePaySession.STATUS_SUCCESS
        );

        alert("Демо-платёж выполнен");
    };

    session.oncancel = function() {
        console.log("Apple Pay cancelled");
    };

    try {
        session.begin();
    } catch (e) {
        console.error(e);
        alert(e.message);
    }
}
</script>

</body>
</html>
