<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Apple Pay Demo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.apple-button{
background:#fff;
color:#000;
border:none;
padding:18px 50px;
font-size:28px;
font-weight:700;
border-radius:18px;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.sheet{
background:#1c1c1e;
width:100%;
max-width:360px;
border-radius:30px;
padding:30px;
text-align:center;
color:white;
animation:show .25s ease;
}

@keyframes show{
from{transform:scale(.9);opacity:0}
to{transform:scale(1);opacity:1}
}

.logo{
font-size:60px;
}

.title{
font-size:26px;
margin-top:10px;
}

.amount{
font-size:38px;
font-weight:bold;
margin:20px 0;
}

.pay{
width:100%;
height:55px;
border:none;
border-radius:14px;
background:#0a84ff;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.face{
display:none;
font-size:80px;
margin-top:15px;
}

.success{
display:none;
font-size:80px;
margin-top:15px;
}

.done{
display:none;
font-size:22px;
margin-top:15px;
}
</style>
</head>

<body>

<button class="apple-button" onclick="openPay()">
 Apple Pay
</button>

<div class="modal" id="modal">
<div class="sheet">

<div class="logo"></div>
<div class="title">Apple Pay</div>

<div class="amount">75 грн</div>

<button class="pay" onclick="payNow()">
Оплатити
</button>

<div class="face" id="face">
😊<br>
Face ID
</div>

<div class="success" id="success">
✅
</div>

<div class="done" id="done">
Оплата успішна
</div>

</div>
</div>

<script>
function openPay(){
document.getElementById("modal").style.display="flex";
}

function payNow(){

document.querySelector(".pay").style.display="none";

document.getElementById("face").style.display="block";

setTimeout(()=>{
document.getElementById("face").style.display="none";
document.getElementById("success").style.display="block";
document.getElementById("done").style.display="block";
},2000);
}

document.getElementById("modal").onclick=function(e){
if(e.target.id==="modal"){
location.reload();
}
}
</script>

</body>
</html>
