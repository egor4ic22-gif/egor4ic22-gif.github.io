<button id="apple-pay-button">Apple Pay</button>

<script>
document.getElementById("apple-pay-button")
    .addEventListener("click", onApplePayButtonClicked);

async function validateMerchant(validationURL) {
    // Для демо возвращаем заглушку.
    // В реальном проекте здесь запрос к серверу.
    console.log("Merchant validation:", validationURL);

    return fetch("/validate-merchant", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            validationURL
        })
    }).then(r => r.json());
}

function calculateTotal(couponCode) {
    let amount = 27.50;

    if (couponCode === "SALE10") {
        amount -= 10;
    }

    return {
        label: "Demo Store",
        amount: {
            value: amount.toFixed(2),
            currency: "USD"
        }
    };
}

function calculateDisplayItem(couponCode) {
    if (couponCode === "SALE10") {
        return [{
            label: "Discount",
            amount: {
                value: "-10.00",
                currency: "USD"
            }
        }];
    }

    return [];
}

function calculateShippingOptions() {
    return [
        {
            id: "standard",
            label: "Standard Shipping",
            amount: {
                value: "5.00",
                currency: "USD"
            },
            selected: true
        },
        {
            id: "express",
            label: "Express Shipping",
            amount: {
                value: "15.00",
                currency: "USD"
            }
        }
    ];
}

function calculateError() {
    return "";
}

async function onApplePayButtonClicked() {

    if (!window.PaymentRequest) {
        alert("Payment Request API is not supported");
        return;
    }

    const paymentMethodData = [{
        supportedMethods: "https://apple.com/apple-pay",
        data: {
            version: 3,
            merchantIdentifier: "merchant.com.example",
            merchantCapabilities: ["supports3DS"],
            supportedNetworks: [
                "visa",
                "masterCard",
                "amex"
            ],
            countryCode: "US"
        }
    }];

    const paymentDetails = {
        total: {
            label: "Demo Store",
            amount: {
                value: "27.50",
                currency: "USD"
            }
        }
    };

    const request = new PaymentRequest(
        paymentMethodData,
        paymentDetails
    );

    request.onmerchantvalidation = event => {
        event.complete(
            validateMerchant(event.validationURL)
        );
    };

    try {
        const response = await request.show();

        console.log("Payment token:", response.details);

        await response.complete("success");

        alert("Test payment completed");
    }
    catch (err) {
        console.error(err);
    }
}
</script>
