<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apple Pay Donation</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:400px;
background:#111;
border-radius:32px;
padding:35px;
text-align:center;
box-shadow:0 0 50px rgba(255,255,255,.05);
}

.logo{
font-size:70px;
margin-bottom:10px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.subtitle{
color:#888;
margin-bottom:25px;
}

input{
width:100%;
padding:18px;
font-size:24px;
border:none;
border-radius:18px;
background:#1d1d1f;
color:white;
text-align:center;
outline:none;
}

.apple-btn{
margin-top:20px;
width:100%;
height:58px;
border:none;
border-radius:16px;
font-size:24px;
font-weight:700;
background:white;
color:black;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.sheet{
width:100%;
max-width:360px;
background:#1c1c1e;
border-radius:28px;
padding:30px;
text-align:center;
animation:show .25s ease;
}

@keyframes show{
from{
transform:scale(.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.face{
font-size:80px;
margin-bottom:10px;
}

.amount{
font-size:32px;
font-weight:bold;
margin:15px 0;
}

.pay{
width:100%;
height:54px;
border:none;
border-radius:14px;
background:#0a84ff;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.loader{
display:none;
font-size:20px;
margin-top:15px;
}

.success{
display:none;
font-size:70px;
margin-top:10px;
}

.done{
display:none;
font-size:22px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="card">
<div class="logo"></div>

<h1>Apple Pay</h1>

<div class="subtitle">
Підтримати проєкт
</div>

<input
id="amount"
type="number"
placeholder="Сума в грн">

<button class="apple-btn" onclick="openPay()">
Apple Pay
</button>
</div>

<div class="modal" id="modal">
<div class="sheet">

<div class="face">😊</div>

<h2>Face ID</h2>

<div class="amount" id="sumText">
0 грн
</div>

<button class="pay" onclick="processPay()">
Оплатити
</button>

<div class="loader" id="loader">
Обробка...
</div>

<div class="success" id="success">
✅
</div>

<div class="done" id="done">
Платіж успішно виконано
</div>

</div>
</div>

<script>
function openPay(){

const amount =
document.getElementById("amount").value;

if(!amount || amount <= 0){
alert("Введіть суму");
return;
}

document.getElementById("sumText")
.innerText = amount + " грн";

document.getElementById("modal")
.style.display = "flex";
}

function processPay(){

document.querySelector(".pay")
.style.display = "none";

document.getElementById("loader")
.style.display = "block";

setTimeout(()=>{

document.getElementById("loader")
.style.display = "none";

document.getElementById("success")
.style.display = "block";

document.getElementById("done")
.style.display = "block";

},2000);
}

document.getElementById("modal")
.addEventListener("click",(e)=>{

if(e.target.id==="modal"){
e.target.style.display="none";

document.querySelector(".pay")
.style.display="block";

document.getElementById("loader")
.style.display="none";

document.getElementById("success")
.style.display="none";

document.getElementById("done")
.style.display="none";
}
});
</script>

</body>
</html>
