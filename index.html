<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Підтримати проєкт</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card{
    width:380px;
    padding:40px;
    border-radius:24px;
    background:#111;
    text-align:center;
    box-shadow:0 0 40px rgba(255,255,255,.08);
}
.logo{
    font-size:48px;
    margin-bottom:10px;
}
h1{
    margin:0;
}
input{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:none;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:20px;
    box-sizing:border-box;
}
.button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:white;
    color:black;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}
.note{
    margin-top:15px;
    color:#888;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">
    <div class="logo"></div>
    <h1>Підтримати проєкт</h1>

    <input type="number" id="amount"
           placeholder="Сума в гривнях">

    <button class="button"
            onclick="donate()">
        Apple Pay
    </button>

    <div class="note">
        Введіть бажану суму пожертви
    </div>
</div>

<script>
function donate(){
    const amount =
      document.getElementById('amount').value;

    if(!amount || amount <= 0){
        alert('Введіть суму');
        return;
    }

    alert(
      'Пожертва: ' + amount +
      ' грн\\n(демонстраційна сторінка)'
    );
}
</script>

</body>
</html>
