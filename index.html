```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Apple Pay Demo</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}

#applePayBtn {
    background: black;
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
}

#paymentBox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
}

#paymentWindow {
    background: white;
    width: 320px;
    margin: 150px auto;
    padding: 20px;
    border-radius: 15px;
}
</style>
</head>
<body>

<button id="applePayBtn"> Pay</button>

<div id="paymentBox">
    <div id="paymentWindow">
        <h2>Apple Pay</h2>
        <p>Demo payment</p>
        <p><b>$1.99</b></p>

        <button onclick="pay()">Pay</button>
        <button onclick="closePay()">Cancel</button>
    </div>
</div>

<script>
const box = document.getElementById("paymentBox");

document.getElementById("applePayBtn").onclick = () => {
    box.style.display = "block";
};

function closePay() {
    box.style.display = "none";
}

function pay() {
    alert("Payment successful (DEMO)");
    box.style.display = "none";
}
</script>

</body>
</html>
